<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#222B38" stroke-width="4"/>
  
  <!-- Subtle grid lines (Trading terminal vibe) -->
  <line x1="80" y1="120" x2="432" y2="120" stroke="#161F2E" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#161F2E" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#161F2E" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="80" y1="360" x2="432" y2="360" stroke="#161F2E" stroke-width="2" stroke-dasharray="4 6"/>
  
  <line x1="140" y1="80" x2="140" y2="432" stroke="#161F2E" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#161F2E" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="372" y1="80" x2="372" y2="432" stroke="#161F2E" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Candlesticks left -->
  <!-- Candle 1: Red/Loss pullback -->
  <line x1="120" y1="250" x2="120" y2="360" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <rect x="110" y="270" width="20" height="60" rx="4" fill="#EF4444" opacity="0.8"/>
  
  <!-- Candle 2: Neutral consolidation -->
  <line x1="170" y1="230" x2="170" y2="330" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <rect x="160" y="250" width="20" height="50" rx="4" fill="#334155"/>

  <!-- Dynamic Kravo "K" formed by Candlestick stem + Momentum breakout chevrons -->
  <!-- Vertical Candle/Stem of K -->
  <line x1="220" y1="110" x2="220" y2="400" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
  <rect x="202" y="160" width="36" height="190" rx="8" fill="url(#brand-grad)" filter="url(#glow)"/>

  <!-- Top diagonal arm of 'K' (Ascending Bullish Breakout) -->
  <path d="M 238 250 L 330 148 C 338 140 350 140 358 148 L 382 172 C 390 180 390 192 382 200 L 290 300 Z" 
        fill="url(#brand-grad)" filter="url(#glow)"/>
        
  <!-- Bottom diagonal arm of 'K' (Liquidity Reversal Anchor) -->
  <path d="M 270 270 L 370 380 C 378 388 378 400 370 408 L 348 426 C 340 434 328 434 320 426 L 225 325 Z" 
        fill="url(#accent-grad)"/>

  <!-- Precision Crosshair Marker at top breakout peak -->
  <circle cx="360" cy="170" r="14" fill="#10B981" opacity="0.4"/>
  <circle cx="360" cy="170" r="6" fill="#FFFFFF"/>
</svg>
